<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>💘 Catch the Love - Valentine Game</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: linear-gradient(to bottom, #ff9a9e, #fad0c4);
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        color: white;
        margin-top: 10px;
        text-shadow: 2px 2px 5px #d6336c;
    }

    #scoreBoard {
        color: white;
        font-size: 20px;
        margin-bottom: 10px;
    }

    #gameArea {
        position: relative;
        width: 100%;
        height: 80vh;
        overflow: hidden;
    }

    .heart {
        position: absolute;
        font-size: 30px;
        animation: fall linear forwards;
        user-select: none;
    }

    @keyframes fall {
        from { top: -50px; }
        to { top: 100vh; }
    }

    #basket {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 50px;
        user-select: none;
    }

    #gameOver {
        display: none;
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 0 20px pink;
    }

    button {
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        background: #ff4d6d;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #d6336c;
    }
</style>
</head>
<body>

<h1>💘 Catch the Love 💘</h1>
<div id="scoreBoard">Score: 0 | Missed: 0</div>

<div id="gameArea">
    <div id="basket">🧺</div>
    <div id="gameOver">
        <h2>💔 Game Over!</h2>
        <p id="finalScore"></p>
        <button onclick="restartGame()">Play Again 💖</button>
    </div>
</div>

<script>
let score = 0;
let missed = 0;
let gameRunning = true;
const basket = document.getElementById("basket");
const gameArea = document.getElementById("gameArea");
const scoreBoard = document.getElementById("scoreBoard");
const gameOverBox = document.getElementById("gameOver");
const finalScoreText = document.getElementById("finalScore");

document.addEventListener("mousemove", (e) => {
    basket.style.left = e.clientX + "px";
});

function createHeart() {
    if (!gameRunning) return;

    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.animationDuration = (2 + Math.random() * 3) + "s";

    gameArea.appendChild(heart);

    let fallInterval = setInterval(() => {
        const heartRect = heart.getBoundingClientRect();
        const basketRect = basket.getBoundingClientRect();

        if (
            heartRect.bottom >= basketRect.top &&
            heartRect.left < basketRect.right &&
            heartRect.right > basketRect.left
        ) {
            score++;
            scoreBoard.textContent = `Score: ${score} | Missed: ${missed}`;
            heart.remove();
            clearInterval(fallInterval);
        }

        if (heartRect.top > window.innerHeight) {
            missed++;
            scoreBoard.textContent = `Score: ${score} | Missed: ${missed}`;
            heart.remove();
            clearInterval(fallInterval);
        }

        if (missed >= 5) {
            endGame();
        }

    }, 50);
}

function endGame() {
    gameRunning = false;
    gameOverBox.style.display = "block";
    finalScoreText.textContent = "Your final score is: " + score + " 💖";
}

function restartGame() {
    score = 0;
    missed = 0;
    gameRunning = true;
    scoreBoard.textContent = `Score: ${score} | Missed: ${missed}`;
    gameOverBox.style.display = "none";
    document.querySelectorAll(".heart").forEach(h => h.remove());
}

setInterval(createHeart, 800);
</script>

</body>
</html>
